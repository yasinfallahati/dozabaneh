[project]
name = "dozabaneh"
version = "0.1.0"
description = "Local web app that adds subtitles in up to two languages to a video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2>=4.5",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "huggingface-hub>=0.26",
    "numpy>=2",
    "tokenizers>=0.20",
    "tqdm>=4.66",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://package-mirror.liara.ir/repository/pypi/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
